name: Run tests

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/run_tests.yaml'
      - 'cospar/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'

  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/run_tests.yaml'
      - 'cospar/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'poetry.lock'

  workflow_call:

jobs:
  run-tests:
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-24.04" ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # scverse-misc imports typing_extensions on Python 3.13 as well.
          python -m pip install . "pytest>=8.3.2,<9" \
            "typing-extensions>=4.14; python_version >= '3.13'"

      - name: Run pytest
        run: python -m pytest
